[package]
name = "epd-gdem0097t61"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Neomium GmbH"]
description = "A no_std embedded-hal driver for the GDEM0097T61 88x184 monochrome e-paper display"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Neomium/eink-display-gdem0097.git"
readme = "README.md"
keywords = ["embedded-hal", "e-paper", "eink", "display"]
categories = ["embedded", "hardware-support", "no-std"]

[features]
default = ["async"]
async = []
example-mocks = []

[dependencies]
embedded-hal = "1.0.0"
embedded-graphics-core = "0.4.1"
embedded-hal-async = "1.0.0"

[dev-dependencies]
mockall = "0.15.0"
embedded-graphics = "0.8.2"
